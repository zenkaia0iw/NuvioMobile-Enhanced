name: Upstream sync

# Daily: merges luqmanfadlli/NuvioMobile-Enhanced `enhanced` (the parent of this fork)
# into this fork's `enhanced` on a dated branch and opens a PR.
# Nothing lands on `enhanced` without review.
#
# Store metadata files (store.json, store-beta.json) describe this fork's own
# identity and builds. On conflict in those files only, our side is kept.
# Any other conflict aborts the sync and opens an issue.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: enhanced

      - name: Merge upstream into a sync branch
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_URL: https://github.com/luqmanfadlli/NuvioMobile-Enhanced.git
          UPSTREAM_BRANCH: enhanced
        run: |
          set -euo pipefail
          git config user.name "fork-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

          # Nothing new upstream? Stop quietly.
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          BRANCH="sync/upstream-$(date -u +%Y%m%d)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Sync branch $BRANCH already exists; skipping."
            exit 0
          fi

          git checkout -b "$BRANCH"
          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            KEPT=""
          else
            conflicted="$(git diff --name-only --diff-filter=U)"
            # Only store metadata may conflict; keep our side for those files.
            other="$(printf '%s\n' "$conflicted" | grep -Ev '^(store\.json|store-beta\.json)$' || true)"
            if [ -z "$conflicted" ] || [ -n "$other" ]; then
              git merge --abort
              gh issue create \
                --title "Upstream sync conflicts ($(date -u +%F))" \
                --body "Merging upstream \`$UPSTREAM_BRANCH\` into \`enhanced\` produced conflicts outside the store metadata files:
          $other
          Resolve locally: see docs/FORK_WORKFLOW.md, section 'Resolving upstream conflicts'."
              exit 1
            fi
            git checkout --ours -- $conflicted
            git add -- $conflicted
            git commit --no-edit
            KEPT="$conflicted"
          fi

          git push origin "$BRANCH"
          body="Automated merge of luqmanfadlli/NuvioMobile-Enhanced \`$UPSTREAM_BRANCH\` into \`enhanced\`. Review, build Android and iOS, then merge."
          if [ -n "$KEPT" ]; then
            body="$body

          Store metadata kept from this fork (upstream conflict resolved to our side): $(echo $KEPT)."
          fi
          gh pr create \
            --base enhanced \
            --head "$BRANCH" \
            --title "Sync upstream $UPSTREAM_BRANCH ($(date -u +%F))" \
            --body "$body"
